name: APIShield DevSecOps
 
on:
  push:
    branches:
      - main
      - "member*"
 
  pull_request:
    branches:
      - main
 
jobs:
 
  validate:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Validate Repository
        run: |
          test -d crAPI
          test -d docs
          test -d evidence
 
